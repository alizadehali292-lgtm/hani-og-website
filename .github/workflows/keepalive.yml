# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity (this happened to keep-warm and notifications-cron on
# 2026-11-07, silently stopping reminder emails). Calling the "enable workflow"
# API on an already-active workflow pushes that deadline back, so this runs
# weekly and re-enables every scheduled workflow here — itself included.
name: keepalive

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in keep-warm.yml cron-notifications.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable"
            echo "$wf: enabled"
          done
          gh workflow list --repo "$REPO" --all
