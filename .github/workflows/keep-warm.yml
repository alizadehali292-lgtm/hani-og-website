name: keep-warm

# Netlify's free tier idles the SSR function after a few minutes, so the first
# visitor after a quiet spell waits ~2-4 s for a cold start. This pings the two
# hottest pages every ~10 minutes to keep the function resident. Free on a
# public repo. GitHub often delays scheduled runs by a few minutes under load —
# harmless here, the goal is just "hit it regularly".
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping public pages
        run: |
          for path in / /palvelut /ajanvaraus; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "${{ vars.SITE_URL }}${path}")
            echo "$path -> $code"
          done
